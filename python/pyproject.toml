[project]
name = "oiseau"
version = "0.1.0"
description = "DG Framework"
authors = [{ name = "tiagovla", email = "tiagovla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.15,<2",
    "matplotlib>=3.9.4,<4",
    "PyQt6>=6,<7",
]

[project.optional-dependencies]
gmsh = ["gmsh>=4.10.3,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=77", "ninja>=1.11.1.4"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oiseau"]

[tool.black]
line-length = 100
