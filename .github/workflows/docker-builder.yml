name: oiseau-baseline-builder
on:
  push:
    branches:
      - master
    paths:
      - .github/docker/oiseau-baseline-builder/Dockerfile
      - .github/workflows/docker-builder.yml
jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          image=ghcr.io/${{ github.repository_owner }}/oiseau-baseline-builder
          docker build \
            -t "$image:latest" \
            -t "$image:${GITHUB_SHA}" \
            .github/docker/oiseau-baseline-builder/
      - name: Push Docker image
        run: |
          image=ghcr.io/${{ github.repository_owner }}/oiseau-baseline-builder
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
