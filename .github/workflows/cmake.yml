name: C++ Build, Test, and Static Analysis
on:
  push:
    branches: [master]
    paths-ignore:
      - .github/docker/oiseau-baseline-builder/**
      - .github/workflows/docker-builder.yml
  pull_request:
    branches: [master]
  workflow_run:
    workflows: [oiseau-baseline-builder]
    branches: [master]
    types: [completed]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  detect_image_changes:
    name: Detect baseline image changes
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.detect.outputs.image_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -Eq '^(\.github/docker/oiseau-baseline-builder/|\.github/workflows/docker-builder\.yml$)' <<< "$changed_files"; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
          fi
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: detect_image_changes
    if: needs.detect_image_changes.outputs.image_changed != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    container:
      image: ghcr.io/${{ github.repository_owner }}/oiseau-baseline-builder:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DOISEAU_BUILD_DOCS=OFF \
            -DOISEAU_BUILD_COVERAGE=OFF \
            -DOISEAU_BUILD_SHARED=OFF
      - name: Build with Ninja
        run: cmake --build build -- -j$(nproc)
      - name: Run tests
        run: ctest --test-dir build --parallel --output-on-failure
  clang-tidy:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-latest
    needs: detect_image_changes
    if: needs.detect_image_changes.outputs.image_changed != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    container:
      image: ghcr.io/${{ github.repository_owner }}/oiseau-baseline-builder:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DOISEAU_BUILD_DOCS=OFF \
            -DOISEAU_BUILD_COVERAGE=OFF \
            -DOISEAU_BUILD_SHARED=OFF
      - name: Run clang-tidy
        run: |
          echo "Running clang-tidy on .cpp files in src/..."
          find src -name '*.cpp' -print0 | \
            xargs -0 -r -n 1 -P $(nproc) \
            clang-tidy \
              -p build \
              --header-filter='^src/oiseau' 2> /dev/null
  cppcheck:
    name: Cppcheck Analysis
    runs-on: ubuntu-latest
    needs: detect_image_changes
    if: needs.detect_image_changes.outputs.image_changed != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    container:
      image: ghcr.io/${{ github.repository_owner }}/oiseau-baseline-builder:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --std=c++20 \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=returnByReference \
            --error-exitcode=2 \
            --check-level=exhaustive \
            src \
            -I src
