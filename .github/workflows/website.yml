name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
    paths-ignore:
      - .github/docker/oiseau-baseline-builder/**
      - .github/workflows/docker-builder.yml
  workflow_dispatch:
  workflow_run:
    workflows: [oiseau-baseline-builder]
    branches: [master]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  detect_image_changes:
    name: Detect baseline image changes
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.detect.outputs.image_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -Eq '^(\.github/docker/oiseau-baseline-builder/|\.github/workflows/docker-builder\.yml$)' <<< "$changed_files"; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build and Upload Site
    runs-on: ubuntu-latest
    needs: detect_image_changes
    if: needs.detect_image_changes.outputs.image_changed != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    container:
      image: ghcr.io/tiagovla/oiseau-baseline-builder:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure CMake with Ninja
        run: |
          cmake -DOISEAU_BUILD_COVERAGE=ON \
            -DOISEAU_BUILD_TEST=ON \
            -DOISEAU_BUILD_DOCS=ON \
            -S . -B build -G Ninja
      - name: Build with Ninja
        run: cmake --build build -- -j$(nproc)
      - name: Build the website
        run: cmake --build build --target website -- -j$(nproc)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  cleanup:
    name: Cleanup old deployments
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: github-pages
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true
  deploy:
    name: Deploy to GitHub Pages
    needs: [build, cleanup]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
