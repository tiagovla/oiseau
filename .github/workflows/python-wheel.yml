name: Dev Python Wheel
on:
  push:
    branches: [master]
concurrency:
  group: python-dev-wheel
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test the wheel
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: python
        env:
          # cibuildwheel builds the abi3 wheel on 3.13 and reuses it on newer CPython versions.
          CIBW_BUILD: "cp*-manylinux_x86_64"
          CIBW_SKIP: "cp*t-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DOISEAU_USE_BUNDLED_OPENBLAS=ON"
          # A unique wheel build tag lets us upload before removing the previous wheel.
          CIBW_CONFIG_SETTINGS: --build-option=--build-number=${{ github.run_id }}r${{ github.run_attempt }}
          CIBW_TEST_GROUPS: dev
          CIBW_TEST_SOURCES: python/test
          CIBW_TEST_COMMAND: python -m pytest -q python/test
      - name: Update the dev prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: Release build for CPython 3.13 and newer on Linux x86-64 (glibc 2.34+) with statically linked OpenBLAS.
        run: |
          repo_api="repos/$GITHUB_REPOSITORY"
          head_sha=$(gh api "$repo_api/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer push superseded this build."
            exit 0
          fi

          wheels=(wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}" || exit 1
          wheel=${wheels[0]}
          [[ "$wheel" == *-cp313-abi3-*.whl ]] || exit 1
          if gh release view dev --json tagName >/dev/null 2>&1; then
            gh release upload dev "$wheel"
            gh release edit dev --notes "$RELEASE_NOTES"
          else
            gh release create dev "$wheel" --target "$GITHUB_SHA" --title "Development wheel" \
              --prerelease --latest=false --notes "$RELEASE_NOTES"
          fi
          gh api --method PATCH "$repo_api/git/refs/tags/dev" \
            -f sha="$GITHUB_SHA" -F force=true --silent

          old_wheels=$(gh release view dev --json assets --jq '.assets[].name | select(endswith(".whl"))')
          while IFS= read -r asset; do
            [[ -n "$asset" && "$asset" != "${wheel##*/}" ]] || continue
            gh release delete-asset dev "$asset" --yes
          done <<< "$old_wheels"
